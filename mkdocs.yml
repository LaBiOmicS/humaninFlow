site_name: humaninFlow
site_description: "Scalable, Data-Agnostic Workflows for Humanin & Mitochondrial-Derived Peptide Discovery"
site_author: "Laboratory of Bioinformatics and Omics Sciences (LaBiOmicS)"
site_url: "https://labiomics.github.io/humaninFlow/"
repo_name: "LaBiOmicS/humaninFlow"
repo_url: "https://github.com/LaBiOmicS/humaninFlow"

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - yaml
    - python
    - bash
    - groovy

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Nextflow Pipeline: nextflow.md
  - Snakemake Pipeline: snakemake.md
  - Parameters & CLI: parameters.md
  - Outputs & Downstream: outputs.md
  - Biological Methodology: methodology.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - codehilite
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
