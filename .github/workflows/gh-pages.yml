name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/gh-pages.yml']
  workflow_dispatch:

# Pages is configured with "GitHub Actions" as its source (build_type: workflow),
# so the site is published from the uploaded artifact; no gh-pages branch is needed.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the page
        run: |
          test -s docs/index.html
          test -f docs/.nojekyll
          python3 - <<'PY'
          from html.parser import HTMLParser
          import re, sys
          html = open("docs/index.html", encoding="utf-8").read()
          ids, hrefs = set(), []
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if "id" in a: ids.add(a["id"])
                  if tag == "a" and a.get("href", "").startswith("#") and len(a["href"]) > 1:
                      hrefs.append(a["href"][1:])
          P().feed(html)
          missing = sorted(set(hrefs) - ids)
          if missing:
              sys.exit(f"Broken in-page links: {missing}")
          print(f"OK: {len(ids)} ids, {len(hrefs)} in-page links resolve")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
