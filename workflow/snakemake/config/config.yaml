# ==============================================================================
# Configuration file for HumaninFinder Snakemake Pipeline
# Data-Agnostic, Portable & Reproducible MDP Discovery Workflow
# ==============================================================================

# Input files (can be relative to Snakefile or absolute paths)
input_fasta: "../../examples/test_mitogenomes.fasta"
metadata: "../../examples/test_metadata.csv"

# Output directory
outdir: "../../results/snakemake"

# HumaninFinder Execution Settings
command: "predict"          # 'predict' (default, best frame) or 'scan' (all non-redundant)
table: "auto"               # NCBI genetic code: 'auto', '2' (vertebrate mt), '2,1', etc.
circular: true              # true for mitogenomes <= 50kb
all_candidates: false       # report all non-redundant candidates (for 'predict')
no_hmm: false               # skip PF15040 HMM domain search
no_rescue: false            # skip HMM-guided frame rescue
no_shlp: false              # skip SHLP1-6 annotation
no_synteny: false           # skip MT-RNR2 synteny search

# Execution Environment
# Path to humanin-finder binary (defaults to system PATH or conda env)
humanin_finder_bin: "humanin-finder"
