# ==============================================================================
# humaninFlow · Snakemake configuration
# Relative paths are resolved against the directory snakemake is run from
# (normally the repository root). Override any key with --config key=value.
# ==============================================================================

# Inputs
input_fasta: "examples/test_mitogenomes.fasta"   # FASTA (plain or .gz)
metadata: "examples/test_metadata.csv"           # CSV/TSV; set to "" to skip the merge

# Output directory
outdir: "results/snakemake"

# HumaninFinder settings
command: "predict"          # 'predict' (best frame per table) or 'scan' (all non-redundant)
table: "auto"               # NCBI genetic code: 'auto', '2' (vertebrate mt), '2,1', ...
circular: true              # treat records <= 50 kb as circular
all_candidates: false       # every non-redundant candidate (with 'predict')
no_hmm: false               # skip the PF15040 HMM domain search
no_rescue: false            # skip HMM-guided frame rescue
no_shlp: false              # skip SHLP1-6 annotation
no_synteny: false           # skip the MT-RNR2 synteny search

# humanin-finder executable (ignored inside --use-conda / --use-apptainer environments)
humanin_finder_bin: "humanin-finder"
